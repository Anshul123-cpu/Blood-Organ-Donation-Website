<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Registration - Blood & Organ Donation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>Blood & Organ Donation</h1>
        </div>
    </header>

    <nav class="navbar">
        <div class="container">
            <ul>
                <li onclick="window.location.href='index.html'">Home</li>
                <li onclick="window.location.href='about-us.html'">About Us</li>
                <li onclick="window.location.href='registration.html'" class="register-btn" style="font-weight: bold;">Register Now!</li>
            </ul>
        </div>
    </nav>

    <section class="form-section">
        <div class="container">
            <div class="form-box">
                <h2>Register Your Personal Details</h2>
                <p class="form-subtitle">Please provide your personal information to get started</p>
               
    <form id="registrationForm" action="register.php" method="POST">
                    <div class="form-group">
                        <label for="name">Full Name *</label>
                        <input type="text" id="name" name="name" placeholder="Enter your full name" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="age">Age *</label>
                            <input type="number" id="age" name="age" placeholder="Enter your age" min="18" max="120" required>
                        </div>
                        <div class="form-group">
                            <label for="gender">Gender *</label>
                            <select id="gender" name="gender" required>
                                <option value="">Select Gender</option>
                                <option value="Male">Male</option>
                                <option value="Female">Female</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="address">Address *</label>
                        <textarea id="address" name="address" placeholder="Enter your complete address" rows="3" required></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="phone">Mobile Number *</label>
                            <input type="tel" id="phone" name="phone" placeholder="Enter your mobile number" pattern="[0-9]{10}" required>
                        </div>
                        <div class="form-group">
                            <label for="email">Email Address *</label>
                            <input type="email" id="email" name="email" placeholder="Enter your email" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="blood_group">Blood Group *</label>
                            <select id="blood_group" name="blood_group" required>
                                <option value="">Select Blood Group</option>
                                <option value="A+">A+</option>
                                <option value="A-">A-</option>
                                <option value="B+">B+</option>
                                <option value="B-">B-</option>
                                <option value="AB+">AB+</option>
                                <option value="AB-">AB-</option>
                                <option value="O+">O+</option>
                                <option value="O-">O-</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="donation_type">Donation Type *</label>
                            <select id="donation_type" name="donation_type" required>
                                <option value="">Select Donation Type</option>
                                <option value="blood">Blood</option>
                                <option value="organ">Organ</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="preferred_date">Preferred Date *</label>
                            <input type="date" id="preferred_date" name="preferred_date" required>
                        </div>
                        <div class="form-group">
                            <label for="hospital_id">Hospital ID *</label>
                            <input type="number" id="hospital_id" name="hospital_id" placeholder="Enter hospital ID" required>
                        </div>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Register & Continue</button>
                        <button type="reset" class="btn btn-secondary">Clear Form</button>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <p>&copy; 2026 Blood & Organ Donation System. All rights reserved.</p>
    </footer>

    <script>
        // Check for user cookie and show welcome message
        document.addEventListener('DOMContentLoaded', function() {
            const userName = getCookie('user_name');
            if (userName) {
                alert('Welcome back ' + userName + '!');
            }

            // Check URL parameters for success/error messages
            const urlParams = new URLSearchParams(window.location.search);
            
            if (urlParams.has('success') && urlParams.get('success') === '1') {
                alert('Registration successful!');
                // Clear the URL parameter
                window.history.replaceState({}, document.title, 'registration.html');
            } else if (urlParams.has('error') && urlParams.get('error') === '1') {
                alert('Registration failed!');
                // Clear the URL parameter
                window.history.replaceState({}, document.title, 'registration.html');
            }
        });

        // Helper function to get cookie value
        function getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
        }
    </script>
    <!-- <script src="script.js"></script> -->
</body>
</html>
